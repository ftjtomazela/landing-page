<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Personal - 82kg</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { color: #f39c12; text-align: center; }
        h2 { color: #f39c12; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .card { 
            background: #1e1e1e; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        label { 
            display: flex; 
            align-items: center; 
            margin: 15px 0; 
            font-size: 1.1em; 
            cursor: pointer; 
        }
        input[type="checkbox"] { 
            transform: scale(1.5); 
            margin-right: 15px; 
            accent-color: #f39c12;
        }
        .checked { 
            text-decoration: line-through; 
            color: #888888; 
        }
        footer { 
            text-align: center; 
            margin-top: 40px; 
            font-size: 0.85em; 
            color: #777; 
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        a { color: #f39c12; text-decoration: none; }
    </style>
</head>
<body>
    <h1>🔥 Diário de Treino e Dieta</h1>

    <div class="card">
        <h2>🍳 Alimentação Base</h2>
        <label><input type="checkbox" onclick="toggleStrike(this)"> Café da manhã: Pão, café, requeijão + 3-4 ovos</label>
        <label><input type="checkbox" onclick="toggleStrike(this)"> Almoço: Arroz, feijão (com aquele bacon), proteína e salada</label>
        <label><input type="checkbox" onclick="toggleStrike(this)"> Lanche: Fruta com aveia ou Whey</label>
        <label><input type="checkbox" onclick="toggleStrike(this)"> Jantar: Proteína caprichada (ou aquele churrasco) + carbo limpo</label>
        <label><input type="checkbox" onclick="toggleStrike(this)"> Meta de Água: 3,5L a 4L no dia</label>
    </div>

    <div class="card">
        <h2>🏋️ Treino de Força (Segurar a Perna!)</h2>
        <label><input type="checkbox" onclick="toggleStrike(this)"> Aquecimento</label>
        <label><input type="checkbox" onclick="toggleStrike(this)"> Exercícios Base (Agachamento/Leg/Supino) com progressão de carga</label>
        <label><input type="checkbox" onclick="toggleStrike(this)"> Exercícios Complementares</label>
        <label><input type="checkbox" onclick="toggleStrike(this)"> Panturrilha ou Abdômen</label>
    </div>

    <div class="card">
        <h2>🚴 Cardio Estratégico</h2>
        <label><input type="checkbox" onclick="toggleStrike(this)"> 20 a 30 min (SÓ nos dias de membros superiores ou descanso)</label>
    </div>

    <footer>
        <p>Acompanhe também no Facebook e TikTok: <a href="https://www.facebook.com/" target="_blank">viajantecg99</a></p>
        <p>CNPJ 40.136.528/0001-07 Tomazela Comercio</p>
    </footer>

    <script>
        // Função simples para riscar o texto quando marcar o checkbox
        function toggleStrike(checkbox) {
            if(checkbox.checked) {
                checkbox.parentElement.classList.add("checked");
            } else {
                checkbox.parentElement.classList.remove("checked");
            }
        }
    </script>
</body>
</html>
